<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="..\css\stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="user-profile">
            <span class="username">Menu Direction</span>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="active">
                    <a href="administrateur.html">
                        <span class="icon"><i class="fa-solid fa-user-shield"></i></span>
                        <span class="label">Administrateur/Direction</span>
                    </a>
                </li>
                <li>
                    <a href="personel.html">
                        <span class="icon"><i class="fa-solid fa-id-card"></i></span>
                        <span class="label">Personnel administratif</span>
                    </a>
                </li>
                <li>
                    <a href="enseignants.html">
                        <span class="icon"><i class="fa-solid fa-chalkboard-user"></i></span>
                        <span class="label">Enseignants</span>
                    </a>
                </li>
                <li>
                    <a href="#parents">
                        <span class="icon"><i class="fa-solid fa-users"></i></span>
                        <span class="label">Parents</span>
                    </a>
                </li>
                <li>
                    <a href="eleves.html">
                        <span class="icon"><i class="fa-solid fa-graduation-cap"></i></span>
                        <span class="label">Elèves</span>
                    </a>
                </li>
                <li class="separator"></li>
                <li>
                    <a href="#" onclick="logOut()">
                        <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                        <span class="label">Déconnexion</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
    <header>
        <h1>Gestion de l'école</h1>
        <div class="boutons">
            <button onclick="afficher('Profs')">Profs</button>
            <button onclick="afficher('Elèves')">Elèves</button>
            <button onclick="afficher('Classes')">Classes</button>
            <button><a href="admin.html">Admin</a></button>
            <button id="menu-btn" class="menu-btn">☰</button>
        </div>
    </header>
    <section id="Profs" class="page active">
        <form id="formProf">
            <input type="text" id="nom" placeholder="Nom du Professeur" required>
            <input type="text" id="prenom" placeholder="Prénom"required>
            <input type="text" id="matiere" placeholder="Matière"required>
            <button type="submit">Ajoute</button>
        </form>
        <div id="modif"></div>
        <table border="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Matière</th>
                    <th>Action</th>
                </tr>
            </thead>
        
            <tbody id="listeProfs"></tbody>
        </table>
    
         </section>
    <section id="Elèves" class="page">
        <form id="formEleve">
            <input type="text"  id="nom" placeholder="Nom de l'élève " required>
            <input type="text" id="prenom"  placeholder="Prénom"required>
            <input type="date" id="date" required>
            <input type="number" id="id" placeholder="id_classe"required>
            <button type="submit">Ajoute</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>date de naissance</th>
                    <th>ID_classe</th>
                    <th>Action</th>
                </tr>
                <tbody id="ListEleve"></tbody>
            </thead>
            
        </table>

    </section>
    <section id="Classes" class="page">
        <form id="formClasse">
            <input type="text" id="nomClasse" placeholder="Nom du classe" required>
            <input type="text" id="niveau" placeholder="niveau"required>
            <input type="number" id="nbr" placeholder="nbr_élèves"required>
            <button type="submit">Ajoute</button>
        </form>
        <div id="modification"></div>
        <table border="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>nom_classe</th>
                    <th>niveau</th>
                    <th>nbr_élèves</th>
                    <th>Action</th>
                </tr>
                <tbody id="listeClasses"></tbody>
            </thead>
            
        </table>
    </section>
    <section id="Matière" class="page">
        <input type="text">
    </section>
    <section id="Note" class="page">
        <input type="text">
    </section>
    <script src="..\js\auth.js"></script>
    <script src="..\js\app.js"></script>
</body>
</html>
